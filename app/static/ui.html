<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pump Detector Prices</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #171b21;
    --panel-2: #1e232b;
    --border: #2a313b;
    --text: #e3e7ec;
    --muted: #8b95a3;
    --accent: #4c9aff;
    --up: #26a69a;
    --down: #ef5350;
    --warn: #e0a83a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 32px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  label.field { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); flex: 1 1 160px; min-width: 0; }
  input, select, button {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; min-width: 0;
  }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .status { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin: 4px 0 8px; font-size: 12px; color: var(--muted); }
  .status .error { color: var(--down); }
  .table-wrap { max-height: 65vh; overflow: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border); }
  th { position: sticky; top: 0; background: var(--panel-2); font-weight: 600; font-size: 12px; color: var(--muted); z-index: 1; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  td.num, th.num { text-align: right; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--panel-2); }
  tbody tr.selected { background: #22324a; }
  .stale { color: var(--warn); }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  #chart-panel { display: none; padding: 12px; margin-bottom: 12px; }
  #chart-panel.open { display: block; }
  .chart-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .chart-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; min-width: 0; }
  .chart-title strong { font-size: 16px; }
  .live-price { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .chart-tools { display: flex; gap: 8px; align-items: center; }
  #chart { width: 100%; height: 380px; }
  #chart-msg { padding: 24px 8px; text-align: center; color: var(--muted); display: none; }
  @media (max-width: 600px) {
    main { padding: 10px 12px 24px; }
    th, td { padding: 6px 8px; }
    #chart { height: 300px; }
    .live-price { font-size: 18px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Pump Detector prices</h1>
    <span class="muted small">Prices refresh every 2 s. Click a row to open its chart.</span>
  </header>

  <section id="chart-panel" class="panel" aria-live="polite">
    <div class="chart-head">
      <div class="chart-title">
        <strong id="chart-symbol"></strong>
        <span class="muted" id="chart-exchange"></span>
        <span class="live-price" id="chart-price">-</span>
        <span class="muted small" id="chart-age"></span>
      </div>
      <div class="chart-tools">
        <label class="muted small" for="interval">Interval</label>
        <select id="interval"></select>
        <button type="button" id="chart-close">Close</button>
      </div>
    </div>
    <div id="chart"></div>
    <div id="chart-msg"></div>
    <div class="muted small" id="chart-status"></div>
  </section>

  <div class="controls">
    <label class="field">Search symbol
      <input id="search" type="search" placeholder="e.g. BTC" autocomplete="off" autocapitalize="characters" spellcheck="false">
    </label>
    <label class="field">Exchange
      <select id="exchange-filter"><option value="">All exchanges</option></select>
    </label>
  </div>

  <div class="status">
    <span id="count">Loading prices...</span>
    <span id="updated"></span>
  </div>

  <div class="panel table-wrap">
    <table>
      <thead>
        <tr>
          <th class="sortable" data-key="symbol">Symbol</th>
          <th class="sortable" data-key="exchange">Exchange</th>
          <th class="sortable num" data-key="price">Price</th>
          <th class="sortable num" data-key="age_seconds">Last update</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
(function () {
  "use strict";

  var MAX_ROWS = 300;
  var PRICE_POLL_MS = 2000;
  var CANDLE_POLL_MS = 5000;

  var state = {
    prices: [],
    candleExchanges: [],
    sortKey: "symbol",
    sortDir: 1,
    selected: null,   // {symbol, exchange}
    interval: "1m",
    fitNext: true
  };

  var el = function (id) { return document.getElementById(id); };
  var rowsEl = el("rows");
  var searchEl = el("search");
  var exFilterEl = el("exchange-filter");
  var intervalEl = el("interval");

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function decimalsFor(p) {
    var a = Math.abs(p);
    if (a >= 1000) return 2;
    if (a >= 1) return 4;
    if (a === 0) return 2;
    // Keep about 5 significant digits for small prices.
    return Math.min(10, Math.max(4, 4 - Math.floor(Math.log10(a))));
  }

  function fmtPrice(p) {
    if (typeof p !== "number" || !isFinite(p)) return "-";
    return p.toFixed(decimalsFor(p));
  }

  function fmtAge(s) {
    if (typeof s !== "number" || !isFinite(s)) return "-";
    if (s < 60) return s.toFixed(s < 10 ? 1 : 0) + " s ago";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h ago";
    return Math.floor(s / 86400) + " d ago";
  }

  async function getJSON(url) {
    var res = await fetch(url, { credentials: "same-origin", cache: "no-store" });
    if (res.status === 401) throw new Error("Not signed in. Reload the page to sign in again.");
    if (!res.ok) throw new Error("Request failed (" + res.status + ")");
    return res.json();
  }

  // ---------- Price table ----------

  function addExchangeOption(name) {
    for (var i = 0; i < exFilterEl.options.length; i++) {
      if (exFilterEl.options[i].value === name) return;
    }
    var opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    exFilterEl.appendChild(opt);
  }

  function filteredRows() {
    var q = searchEl.value.trim().toUpperCase();
    var ex = exFilterEl.value;
    var out = [];
    for (var i = 0; i < state.prices.length; i++) {
      var r = state.prices[i];
      if (ex && r.exchange !== ex) continue;
      if (q && r.symbol.toUpperCase().indexOf(q) === -1) continue;
      out.push(r);
    }
    var k = state.sortKey, d = state.sortDir;
    out.sort(function (a, b) {
      var x = a[k], y = b[k];
      var c = typeof x === "string" ? x.localeCompare(y) : x - y;
      if (c === 0 && k !== "symbol") c = a.symbol.localeCompare(b.symbol);
      if (c === 0) c = a.exchange.localeCompare(b.exchange);
      return c * d;
    });
    return out;
  }

  function renderTable() {
    var rows = filteredRows();
    var shown = rows.length > MAX_ROWS ? rows.slice(0, MAX_ROWS) : rows;
    var sel = state.selected;
    var html = new Array(shown.length);
    for (var i = 0; i < shown.length; i++) {
      var r = shown[i];
      var isSel = sel && sel.symbol === r.symbol && sel.exchange === r.exchange;
      html[i] =
        '<tr data-i="' + i + '"' + (isSel ? ' class="selected"' : "") + ">" +
        "<td>" + esc(r.symbol) + "</td>" +
        "<td>" + esc(r.exchange) + "</td>" +
        '<td class="num">' + fmtPrice(r.price) + "</td>" +
        '<td class="num' + (r.age_seconds > 60 ? " stale" : "") + '">' + fmtAge(r.age_seconds) + "</td>" +
        "</tr>";
    }
    rowsEl.innerHTML = shown.length
      ? html.join("")
      : '<tr><td colspan="4" class="empty">' +
        (state.prices.length ? "No prices match the filter." : "No prices yet.") + "</td></tr>";
    rowsEl._shown = shown;

    var total = state.prices.length;
    el("count").textContent = rows.length > MAX_ROWS
      ? "Showing " + MAX_ROWS + " of " + rows.length + " matching (" + total + " total). Narrow the search to see more."
      : "Showing " + rows.length + " of " + total;

    document.querySelectorAll("th.sortable").forEach(function (th) {
      var base = th.textContent.replace(/ [▲▼]$/, "");
      th.textContent = th.dataset.key === state.sortKey ? base + (state.sortDir > 0 ? " ▲" : " ▼") : base;
    });
  }

  async function pollPrices() {
    try {
      var data = await getJSON("/ui/api/prices");
      state.prices = data;
      for (var i = 0; i < data.length; i++) addExchangeOption(data[i].exchange);
      renderTable();
      updateLivePrice();
      el("updated").textContent = "Updated " + new Date().toLocaleTimeString();
      el("updated").classList.remove("error");
    } catch (e) {
      el("updated").textContent = e.message;
      el("updated").classList.add("error");
    } finally {
      setTimeout(pollPrices, PRICE_POLL_MS);
    }
  }

  async function loadExchanges() {
    try {
      var data = await getJSON("/ui/api/exchanges");
      state.candleExchanges = data.candle_exchanges || [];
      (data.exchanges || []).forEach(function (e) { addExchangeOption(e.name); });
      var intervals = data.intervals || ["1m"];
      intervalEl.innerHTML = intervals.map(function (iv) {
        return '<option value="' + esc(iv) + '"' + (iv === state.interval ? " selected" : "") + ">" + esc(iv) + "</option>";
      }).join("");
    } catch (e) {
      intervalEl.innerHTML = '<option value="1m" selected>1m</option>';
    }
  }

  searchEl.addEventListener("input", renderTable);
  exFilterEl.addEventListener("change", renderTable);
  document.querySelectorAll("th.sortable").forEach(function (th) {
    th.addEventListener("click", function () {
      var k = th.dataset.key;
      if (state.sortKey === k) state.sortDir = -state.sortDir;
      else { state.sortKey = k; state.sortDir = 1; }
      renderTable();
    });
  });
  rowsEl.addEventListener("click", function (ev) {
    var tr = ev.target.closest("tr[data-i]");
    if (!tr || !rowsEl._shown) return;
    var r = rowsEl._shown[Number(tr.dataset.i)];
    if (r) openChart(r.symbol, r.exchange);
  });

  // ---------- Chart ----------

  var chart = null, candleSeries = null, volumeSeries = null;
  var candleTimer = null;
  var candleRequest = 0;

  function ensureChart() {
    if (chart) return true;
    if (!window.LightweightCharts) return false;
    chart = LightweightCharts.createChart(el("chart"), {
      autoSize: true,
      layout: { background: { type: "solid", color: "#171b21" }, textColor: "#c3cad3" },
      grid: { vertLines: { color: "#232931" }, horzLines: { color: "#232931" } },
      rightPriceScale: { borderColor: "#2a313b" },
      timeScale: { borderColor: "#2a313b", timeVisible: true, secondsVisible: false },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal }
    });
    candleSeries = chart.addCandlestickSeries({
      upColor: "#26a69a", downColor: "#ef5350",
      wickUpColor: "#26a69a", wickDownColor: "#ef5350", borderVisible: false
    });
    candleSeries.priceScale().applyOptions({ scaleMargins: { top: 0.08, bottom: 0.25 } });
    volumeSeries = chart.addHistogramSeries({
      priceFormat: { type: "volume" }, priceScaleId: "", color: "rgba(76,154,255,0.45)"
    });
    volumeSeries.priceScale().applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
    return true;
  }

  function showChartMessage(msg) {
    el("chart").style.display = msg ? "none" : "block";
    el("chart-msg").style.display = msg ? "block" : "none";
    el("chart-msg").textContent = msg || "";
  }

  function updateLivePrice() {
    var sel = state.selected;
    if (!sel) return;
    var row = null;
    for (var i = 0; i < state.prices.length; i++) {
      var r = state.prices[i];
      if (r.symbol === sel.symbol && r.exchange === sel.exchange) { row = r; break; }
    }
    el("chart-price").textContent = row ? fmtPrice(row.price) : "-";
    el("chart-age").textContent = row ? fmtAge(row.age_seconds) : "no live price";
  }

  function openChart(symbol, exchange) {
    state.selected = { symbol: symbol, exchange: exchange };
    state.fitNext = true;
    el("chart-symbol").textContent = symbol;
    el("chart-exchange").textContent = exchange;
    el("chart-panel").classList.add("open");
    updateLivePrice();
    renderTable();
    el("chart-panel").scrollIntoView({ behavior: "smooth", block: "start" });
    loadCandles();
  }

  function closeChart() {
    state.selected = null;
    clearTimeout(candleTimer);
    candleRequest++;
    el("chart-panel").classList.remove("open");
    renderTable();
  }

  async function loadCandles() {
    clearTimeout(candleTimer);
    var sel = state.selected;
    if (!sel) return;
    var req = ++candleRequest;
    var interval = state.interval;
    var stored = state.candleExchanges.indexOf(sel.exchange) !== -1;

    if (state.candleExchanges.length && !stored) {
      showChartMessage("Candles are only stored for " + state.candleExchanges.join(", ") +
        ". This exchange has live prices only.");
      el("chart-status").textContent = "";
      return;
    }
    if (!ensureChart()) {
      showChartMessage("The chart library could not be loaded. Live price above still updates.");
      return;
    }
    try {
      var url = "/ui/api/candles?symbol=" + encodeURIComponent(sel.symbol) +
        "&exchange=" + encodeURIComponent(sel.exchange) +
        "&interval=" + encodeURIComponent(interval) + "&limit=100";
      var data = await getJSON(url);
      if (req !== candleRequest) return;
      if (!data.candles_stored) {
        showChartMessage("Candles are only stored for " + (data.candle_exchanges || []).join(", ") +
          ". This exchange has live prices only.");
        el("chart-status").textContent = "";
        return;
      }
      var candles = data.candles || [];
      if (!candles.length) {
        showChartMessage("No " + interval + " candles stored yet for " + sel.symbol + " on " + sel.exchange + ".");
      } else {
        showChartMessage("");
        var last = candles[candles.length - 1].close;
        var dec = decimalsFor(last);
        candleSeries.applyOptions({ priceFormat: { type: "price", precision: dec, minMove: Math.pow(10, -dec) } });
        candleSeries.setData(candles.map(function (c) {
          return { time: c.time, open: c.open, high: c.high, low: c.low, close: c.close };
        }));
        var hasVolume = candles.some(function (c) { return c.volume > 0; });
        volumeSeries.setData(hasVolume ? candles.map(function (c) {
          return {
            time: c.time, value: c.volume,
            color: c.close >= c.open ? "rgba(38,166,154,0.45)" : "rgba(239,83,80,0.45)"
          };
        }) : []);
        chart.applyOptions({ timeScale: { secondsVisible: /s$/.test(interval) } });
        if (state.fitNext) { chart.timeScale().fitContent(); state.fitNext = false; }
      }
      el("chart-status").textContent = candles.length + " candles (" + interval + "), refreshed " +
        new Date().toLocaleTimeString() + ". Times shown in UTC.";
    } catch (e) {
      if (req !== candleRequest) return;
      el("chart-status").textContent = e.message;
    } finally {
      if (req === candleRequest && state.selected) candleTimer = setTimeout(loadCandles, CANDLE_POLL_MS);
    }
  }

  intervalEl.addEventListener("change", function () {
    state.interval = intervalEl.value;
    state.fitNext = true;
    loadCandles();
  });
  el("chart-close").addEventListener("click", closeChart);

  loadExchanges().then(pollPrices);
})();
</script>
</body>
</html>
