# Production layout for the Hetzner box: only Caddy is reachable from the
# internet (80/443, automatic TLS for $DOMAIN); the app and Mongo stay on the
# internal network. Set DOMAIN and API_KEY in .env (see .env.example).
services:
  mongodb:
    image: mongo:7
    container_name: crypto_pump_detector_mongodb
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=crypto_pump_detector
    restart: unless-stopped

  app:
    build: .
    container_name: crypto_pump_detector_app
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=crypto_pump_detector
    depends_on:
      - mongodb
    restart: unless-stopped
    env_file:
      - .env

  caddy:
    image: caddy:2
    container_name: crypto_pump_detector_caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mongodb_data:
  caddy_data:
