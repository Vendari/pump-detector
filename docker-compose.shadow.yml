# Runs the Rust service next to the Python one for comparison: its own
# database, no outgoing webhooks, trailing closes only logged. Reachable on
# the box at 127.0.0.1:8001 only.
#   docker compose -f docker-compose.yml -f docker-compose.shadow.yml up -d --build app-rs
services:
  app-rs:
    build: ./rust
    container_name: crypto_pump_detector_rs_shadow
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=crypto_pump_detector_rs_shadow
      - WEBHOOK_URL=
      - TRAILING_CLOSE_URL=
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      - mongodb
    restart: unless-stopped
